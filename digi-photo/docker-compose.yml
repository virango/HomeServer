version: "3.9"
services:
  watcher:
    build:
      context: .
      dockerfile: watcher/Dockerfile
    volumes:
      - /Volumes/HomeServerData/Digi-Photo/Download:/watch
      - /Volumes/HomeServerData/OneDrive/Media/Pictures:/photos
      - /Volumes/HomeServerData/Digi-Photo/Data:/data
    environment:
      WATCH_DIR: /watch
      DEFAULT_DEST_DIR: /photos
      ROOT_MEDIA_DIR: /photos
      EVENTS_DB_PATH: /data/events.db
      POLL_INTERVAL: "15"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - /Volumes/HomeServerData/Digi-Photo/Data:/data
      - /Volumes/HomeServerData/OneDrive/Media/Pictures:/photos
    environment:
      EVENTS_DB_PATH: /data/events.db
      DEFAULT_DEST_DIR: /photos
      ROOT_MEDIA_DIR: /photos
      WEB_PORT: "8080"
    restart: unless-stopped

  digikam_db:
    image: mysql:9.0
    container_name: digikam_db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: <todo:set a strong password here>
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_USER: tholan
      MYSQL_PASSWORD: <todo:set a strong password here>

    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci

    ports:
      - "3306:3306"

    volumes:
      - /Volumes/HomeServerData/Digi-Photo/digiKam/data:/var/lib/mysql
      - /Volumes/HomeServerData/Digi-Photo/digiKam/conf:/etc/mysql/conf.d
      - /Volumes/HomeServerData/Digi-Photo/digiKam/init:/docker-entrypoint-initdb.d
  
