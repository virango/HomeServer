version: "3.9"
services:
  watcher:
    build:
      context: .
      dockerfile: watcher/Dockerfile
    volumes:
      - ./watch:/watch
      - /Volumes/HomeServerData/OneDrive/Media/Pictures:/photos
      - ./data:/data
    environment:
      WATCH_DIR: /watch
      DEFAULT_DEST_DIR: /photos
      ROOT_MEDIA_DIR: /photos
      EVENTS_DB_PATH: /data/events.db
      POLL_INTERVAL: "15"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - /Volumes/HomeServerData/OneDrive/Media/Pictures:/photos
    environment:
      EVENTS_DB_PATH: /data/events.db
      DEFAULT_DEST_DIR: /photos
      ROOT_MEDIA_DIR: /photos
      WEB_PORT: "8080"
    restart: unless-stopped
