services:
  onedrive:
    image: driveone/onedrive:debian
    container_name: onedrive
    restart: unless-stopped

    # Adapt UID/GID to mac user
    environment:
      - ONEDRIVE_UID=501
      - ONEDRIVE_GID=20
      - ONEDRIVE_VERBOSE=0

    volumes:
      # Configuration & Database
      - /Volumes/HomeServerData/OneDriveConfig:/onedrive/conf
      # Your local OneDrive sync folder
      - /Volumes/HomeServerData/OneDrive:/onedrive/data

      # For interactive login (OAuth)
    command: >
      --monitor
      --confdir=/onedrive/conf
      --syncdir=/onedrive/data
