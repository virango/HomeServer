version: "3.9"

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    user: "1000:1000"
    ports:
      - "8086:8086"
    volumes:
      - /Volumes/HomeServerData/Monitoring/influxdb2/var/lib/influxdb2:/var/lib/influxdb2
      - /Volumes/HomeServerData/Monitoring/influxdb2/etc/influxdb2:/etc/influxdb2
    environment:
      - INFLUXD_LOG_LEVEL=info
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - /Volumes/HomeServerData/Monitoring/grafana/var/lib/grafana:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    volumes:
      - /Volumes/HomeServerData/Monitoring/telegraf/etc/telegraf:/etc/telegraf
    depends_on:
      - influxdb
    restart: unless-stopped		
